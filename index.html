<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ecdfc6">
<title>Ramen Builder AR</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%9C%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="vendor/anatomy/iso.css">
<link rel="stylesheet" href="css/anatomy-sepia.css">
<link rel="stylesheet" href="css/game.css">
<!-- mind-ar@1.2.5 imports sRGBEncoding, removed in three r162: keep three pinned at 0.160.0. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
  }
}
</script>
</head>
<body class="iso ar" data-theme="sepia">

<!-- camera + 3D scene (MindAR or demo board) -->
<div id="ar"></div>

<!-- ============ VIEWFINDER: the page opens straight into it ============ -->
<div id="guide" class="overlay">
  <div class="scan-top plate"><b id="guideTitle">Point your camera at the ramen picture</b></div>
  <div class="frame"><i></i><i></i><i></i><i></i><div class="sweep"></div></div>
  <div class="scan-bottom">
    <div class="status" id="scanStatus">Starting camera…</div>
    <div class="row">
      <button class="btn ghost small" id="scanRetry" hidden>Try again</button>
    </div>
  </div>
</div>

<!-- ============ INTRO: comes up once the picture is recognised (as in sushi-ar and Noh_Masks) ============ -->
<section id="intro" class="screen dim">
  <div class="col center">
    <div class="plate welcome">
      <button class="closex" id="introClose" aria-label="Close and go back to Scan to Play"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button>
      <img class="hero-art" src="assets/bowl-cutout.png" alt="A painted bowl of shoyu ramen">
      <h1>Ramen Builder</h1>
      <p>Cook ramen bowls from all over Japan, layer by layer, before the clock runs out.</p>
      <button class="btn red" id="startBtn">Start</button>
    </div>
  </div>
</section>

<!-- ============ AR HUD ============ -->
<div id="hud" class="overlay">
  <div class="hudstack" id="hudstack">
  <div class="hud top">
    <div class="plate score" id="scoreBox">
      <div class="odo" id="odo"></div>
    </div>
    <div class="mult" id="mult" data-m="1"><div>×1<small>combo 0</small></div></div>
    <div class="plate lives" id="lives"></div>
    <button class="iconbtn" id="pauseBtn" aria-label="Pause"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.2" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.2" fill="currentColor"/></svg></button>
  </div>

  <div class="plate ordercard" id="order">
    <div class="ordmain">
      <div class="ordtext">
        <div class="name" id="ordName"></div>
      </div>
    </div>
    <div class="ticket" id="ticket"></div>
    <div class="timer" id="timer"><b id="timerBar"></b></div>
  </div>
  </div>
</div>

<!-- ============ PAUSE ============ -->
<section id="pause" class="screen dim">
  <div class="col center">
    <div class="plate panel">
      <h2>Paused</h2>
      <button class="btn" id="resumeBtn">Keep cooking</button>
      <button class="btn ghost" id="factsBtn">Facts: on</button>
      <button class="btn ghost" id="quitBtn">End game</button>
    </div>
  </div>
</section>

<!-- ============ GAME OVER (laid out as in sushi-ar) ============ -->
<section id="over" class="screen dim">
  <div class="col center">
    <div class="plate final">
      <h2>Game over</h2>
      <div class="bignum" id="finalScore">0</div>
      <div class="newbest" id="newBest">★ NEW BEST ★</div>
      <div class="stats">
        <div><b id="stBowls">0</b><span>Bowls served</span></div>
        <div><b id="stBest">0</b><span>High score</span></div>
      </div>
      <div class="learned" id="learned"></div>
      <div class="made" id="made"></div>
      <div class="over-actions">
        <button class="btn red" id="againBtn">Play again</button>
        <button class="btn ghost" id="menuBtn">Exit</button>
      </div>
    </div>
  </div>
</section>

<!-- ============ HOW TO PLAY: a short guided tour before the first order starts ============ -->
<div id="howto" class="overlay">
  <div class="spot" id="spot"></div>
  <div class="plate coach" id="coach">
    <span class="corner tl" id="coachStep">How to play · 1/4</span>
    <div class="coach-title" id="coachTitle"></div>
    <div class="coach-text" id="coachText"></div>
    <div class="coach-row">
      <button class="link" id="coachSkip">Skip</button>
      <button class="btn red small" id="coachNext">Next</button>
    </div>
  </div>
</div>

<!-- ============ BOWL SERVED: a fact about the region; Continue starts the next order ============ -->
<div id="fact" class="overlay">
  <div class="plate factcard" id="factCard">
    <div class="factbowl" id="factBowl"></div>
    <div class="factname" id="factName"></div>
    <div class="factplace" id="factPlace"></div>
    <p class="facttext" id="factText"></p>
    <button class="btn red" id="factNext">Continue</button>
  </div>
</div>

<div class="plate toast" id="toast"></div>
<div class="plate errbox" id="err" hidden><b>Something went wrong</b><pre id="errText"></pre><button class="btn small" id="errBtn">Start over</button></div>

<script type="module" src="js/game.js"></script>
</body>
</html>
